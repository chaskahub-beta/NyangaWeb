# Producción en un VPS con dominio propio y HTTPS automático (Caddy + Let's Encrypt).
#
# En el servidor, desde la carpeta del proyecto:
#   1. Apuntar el DNS del dominio (registro A) a la IP del VPS.
#   2. Crear .env (ver .env.example) con PUBLIC_URL=https://tu-dominio y DOMAIN=tu-dominio
#   3. docker compose -f deploy/docker-compose.vps.yml up -d --build
name: nyanga
services:
  web:
    build: ..
    image: nyanga-beauty-spa
    restart: unless-stopped
    env_file: ../.env
    expose:
      - "5500"
    volumes:
      - nyanga-data:/app/data

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?Définir DOMAIN dans .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  nyanga-data:
  caddy-data:
  caddy-config:
