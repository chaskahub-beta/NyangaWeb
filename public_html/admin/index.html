<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Panel · Nyanga Beauty</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Jost:wght@300;400;500&display=swap">
  <link rel="stylesheet" href="admin.css?v=20261114e">
</head>
<body>

  <!-- Connexion -->
  <section class="login" id="login" hidden>
    <form class="login-card" id="login-form">
      <div class="brand"><span class="brand-name">Nyanga</span><span class="brand-sub">panel</span></div>
      <label for="password">Mot de passe</label>
      <input id="password" type="password" autocomplete="current-password" required>
      <button class="btn btn-dark" type="submit">Se connecter</button>
      <p class="error" id="login-error" role="alert"></p>
    </form>
  </section>

  <!-- Application -->
  <div class="app" id="app" hidden>
    <header class="top">
      <div class="brand"><span class="brand-name">Nyanga</span><span class="brand-sub">panel</span></div>
      <nav class="tabs" aria-label="Sections">
        <button class="tab" data-tab="agenda" aria-current="page">Agenda</button>
        <button class="tab" data-tab="calendrier">Calendrier</button>
        <button class="tab" data-tab="cadeaux">Cartes cadeau</button>
        <button class="tab" data-tab="reglages">Réglages</button>
      </nav>
      <button class="btn btn-ghost" id="logout">Déconnexion</button>
    </header>

    <div class="modes" id="modes"></div>

    <main>
      <!-- Agenda -->
      <section class="panel" id="tab-agenda">
        <div class="toolbar">
          <label>Afficher
            <select id="agenda-filter">
              <option value="upcoming">À venir</option>
              <option value="today">Aujourd'hui</option>
              <option value="active">Paiements en cours + confirmées</option>
              <option value="cancelled">Annulées</option>
              <option value="past">30 derniers jours</option>
            </select>
          </label>
          <button class="btn btn-outline" id="agenda-refresh">Actualiser</button>
        </div>
        <div id="agenda-list" class="agenda"></div>
      </section>

      <!-- Calendrier -->
      <section class="panel" id="tab-calendrier" hidden>
        <div class="cal-layout">
          <div class="cal-box">
            <div class="cal-head">
              <button class="btn btn-outline" id="cal-prev" aria-label="Mois précédent">‹</button>
              <h2 id="cal-title"></h2>
              <button class="btn btn-outline" id="cal-next" aria-label="Mois suivant">›</button>
            </div>
            <div class="cal-grid" id="cal-grid"></div>
            <p class="hint">Cliquez sur un jour pour le bloquer, ajouter une indisponibilité ou voir ses rendez-vous.</p>
          </div>
          <aside class="day-panel" id="day-panel">
            <p class="hint">Choisissez un jour.</p>
          </aside>
        </div>
      </section>

      <!-- Cartes cadeau -->
      <section class="panel" id="tab-cadeaux" hidden>
        <form class="toolbar" id="gift-form">
          <label>Code de la carte cadeau
            <input id="gift-code" placeholder="NYG-XXXX-XXXX" autocomplete="off" required>
          </label>
          <button class="btn btn-dark" type="submit">Rechercher</button>
        </form>
        <div id="gift-result"></div>
      </section>

      <!-- Réglages -->
      <section class="panel" id="tab-reglages" hidden>
        <form id="settings-form" class="settings">
          <h2>Horaires d'ouverture</h2>
          <p class="hint">Les jours fériés français sont toujours fermés. Pour fermer un jour précis, utilisez le calendrier.</p>
          <div id="hours"></div>
          <h2>Agenda</h2>
          <div class="row">
            <label>Intervalle entre deux créneaux
              <select id="slot-step">
                <option value="15">15 min</option>
                <option value="30">30 min</option>
                <option value="45">45 min</option>
                <option value="60">60 min</option>
              </select>
            </label>
            <label>Pause entre deux clientes (min)
              <input id="buffer" type="number" min="0" max="120" step="5">
            </label>
          </div>
          <button class="btn btn-dark" type="submit">Enregistrer</button>
          <p class="status" id="settings-status" role="status"></p>
        </form>
      </section>
    </main>
  </div>

  <!-- Détail d'un rendez-vous -->
  <div class="backdrop" id="backdrop" hidden></div>
  <aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title" hidden>
    <div class="drawer-head">
      <h2 id="drawer-title">Rendez-vous</h2>
      <button class="btn btn-ghost" id="drawer-close" aria-label="Fermer">✕</button>
    </div>
    <div class="drawer-body" id="drawer-body"></div>
  </aside>

  <script src="admin.js?v=20261114e"></script>
</body>
</html>
